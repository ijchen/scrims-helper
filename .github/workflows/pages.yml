name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Stage website files
        run: |
          mkdir _site
          cp index.html app.js model.js storage.js catalog.js search.js games-ui.js style.css games.css .nojekyll _site/
          cp -R assets _site/
          cp LICENSE LICENSE-MIT LICENSE-APACHE ASSETS.md _site/
          cp scrims-ui.js _site/
          cp backups.js backups-ui.js _site/
          cp schema.js catalog-references.js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
